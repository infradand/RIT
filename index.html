<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>RIT · Reunión de Inicio de Turno</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{--dorado:#F4AA00;--naranjo:#E55302;--turquesa:#0098AA;--rojo:#C13832;--pizarra:#36424A;--pizarra2:#2A333A;--verde:#2E8B57;
 --bg:#F2F3F4;--txt:#1E2428;--muted:#6B7580;--line:#DCE0E4;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px}
body{padding-bottom:96px}
header{position:sticky;top:0;z-index:20;background:var(--pizarra);color:#fff}
.brand{height:5px;background:linear-gradient(90deg,var(--dorado) 0 25%,var(--naranjo) 25% 50%,var(--turquesa) 50% 75%,var(--rojo) 75% 100%)}
.hbar{display:flex;align-items:center;gap:10px;padding:10px 14px}
.hbar .logo{width:36px;height:36px;border-radius:9px;background:var(--dorado);display:grid;place-items:center;font-weight:800;color:var(--pizarra);font-size:13px;flex:none}
.hbar h1{font-size:15px;margin:0;flex:1;line-height:1.2;min-width:0}.hbar h1 small{display:block;font-weight:400;font-size:11px;opacity:.75}
.help{width:32px;height:32px;border-radius:50%;background:var(--dorado);color:var(--pizarra);font-weight:800;border:none;font-size:16px;flex:none}
#timer{background:rgba(255,255,255,.14);border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap}#timer.over{background:var(--rojo)}
.prog{background:var(--pizarra2);padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(255,255,255,.8)}
.prog .bar{flex:1;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}.prog .bar i{display:block;height:100%;background:var(--dorado)}
main{padding:14px 14px 0;max-width:640px;margin:0 auto}
.q{font-size:22px;font-weight:700;line-height:1.2;margin:4px 0 6px;color:var(--pizarra)}
.guia{font-size:13px;color:#4a545c;line-height:1.45;margin:0 0 14px;padding:8px 12px;border-left:4px solid var(--dorado);background:#fff;border-radius:8px}
.card{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--pizarra)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--txt);font-family:inherit}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--turquesa);border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:12px;border:none;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.p{background:var(--dorado);color:var(--pizarra)}.btn.s{background:#fff;border:1.5px solid var(--line);color:var(--pizarra)}.btn.t{background:var(--turquesa);color:#fff}.btn.r{background:var(--rojo);color:#fff}
.btn.d{background:transparent;color:var(--rojo);padding:6px 8px;font-size:13px;font-weight:600}.btn.w{width:100%;margin-top:8px}.btn.sm{padding:9px 12px;font-size:14px}.btn.big{padding:18px;font-size:18px}
.big.p{box-shadow:0 4px 14px rgba(244,170,0,.35)}
.persona{display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
.persona.on{border-color:var(--verde);background:#F0F8F3}.persona.sel{border-color:var(--dorado);background:#FDF5DC}
.persona .av{width:40px;height:40px;border-radius:50%;background:var(--pizarra);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.persona.on .av{background:var(--verde)}.persona.sel .av{background:var(--dorado);color:var(--pizarra)}
.persona .nm{flex:1;min-width:0;font-weight:600}.persona .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.yn{display:flex;gap:4px}.yn button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font-size:14px;font-weight:700;color:var(--muted);font-family:inherit}
.yn button.si{border-color:var(--verde);background:var(--verde);color:#fff}.yn button.no{border-color:var(--rojo);background:var(--rojo);color:#fff}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#EEF1F3;color:var(--pizarra)}
.tag.rf{background:#FFF4EC;color:var(--naranjo)}.tag.ok{background:#E6F4EC;color:var(--verde)}.tag.no{background:#FBE9E8;color:var(--rojo)}.tag.tv{background:#E6F4EC;color:var(--verde);border:1px solid var(--verde)}.tag.ccp{background:#E5F6F8;color:var(--turquesa)}.tag.ccm{background:#FDF1D7;color:#8A5E00}
.act{border:1.5px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px;background:#fff}.act.crit{border-color:var(--naranjo)}
.act .top{display:flex;gap:8px;align-items:center}.act .num{width:30px;height:30px;border-radius:50%;background:var(--pizarra);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}.act.crit .num{background:var(--naranjo)}
.prep{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1.5px solid var(--line);border-radius:99px;padding:7px 12px;font-size:13px;background:#fff;cursor:pointer}.chip.on{border-color:var(--naranjo);background:#FFF4EC;color:var(--naranjo);font-weight:700}
.rfbox{border:1.5px solid #FFD9C2;background:#FFFAF6;border-radius:10px;padding:10px;margin-top:10px}
.ctl{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ctl button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;font-size:13px;text-align:left;line-height:1.3;color:var(--txt);width:100%;font-family:inherit}
.ctl button.on{border-color:var(--turquesa);background:#E5F6F8}.ctl button b{display:block;font-size:10px;color:var(--muted)}.ctl button.on b{color:var(--turquesa)}.ctl button i{display:block;font-style:normal;font-size:12px;color:var(--verde);margin-top:2px}
.info{font-size:13px;color:var(--muted);background:#F5F7F8;border-radius:8px;padding:8px 10px;margin-top:6px;line-height:1.4}.info.warn{background:#FBE9E8;color:var(--rojo)}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:20}
.foot .btn{flex:1}.foot .btn.s{flex:.6}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:16px}
.sigbox{border:1.5px dashed var(--line);border-radius:10px;min-height:100px;background:#fff;display:grid;place-items:center;cursor:pointer;overflow:hidden}.sigbox img{max-height:100px;max-width:100%}
.sigcv{width:100%;height:240px;border:1.5px solid var(--line);border-radius:10px;background:#fff;touch-action:none;display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end}.modal.open{display:flex}
.modal .box{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.modal .box h3{margin:0 0 10px;font-size:18px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--pizarra);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none}.toast.show{opacity:1}
.hid{display:none!important}
.hoy{background:var(--pizarra);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:14px}.hoy h2{margin:0 0 4px;color:var(--dorado);font-size:13px;letter-spacing:.05em}.hoy .f{font-size:22px;font-weight:700;margin-bottom:12px}.hoy p{margin:0 0 10px;font-size:13px;opacity:.85;line-height:1.4}
.ritrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.ritrow:last-child{border-bottom:none}.ritrow .nm{flex:1;min-width:0;font-size:14px}.ritrow .nm small{display:block;color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:#fff;border-radius:10px;padding:10px;border-top:4px solid var(--dorado)}.kpi b{display:block;font-size:24px;line-height:1.1}.kpi span{font-size:11px;color:var(--muted)}
.kpi.t{border-color:var(--turquesa)}.kpi.r{border-color:var(--rojo)}.kpi.v{border-color:var(--verde)}.kpi.n{border-color:var(--naranjo)}
.hlist div{position:relative;padding:8px 0 8px 36px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.4;counter-increment:p}.hlist{counter-reset:p}
.hlist div::before{content:counter(p);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;background:var(--dorado);color:var(--pizarra);font-weight:800;display:grid;place-items:center;font-size:12px}
.sum dl{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin:0;font-size:13px}.sum dt{color:var(--muted)}.sum dd{margin:0}
.toggle{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;margin-top:10px}.toggle.on{border-color:var(--dorado);background:#FDF5DC}
.toggle .sw{width:44px;height:26px;border-radius:13px;background:#CFD4D8;position:relative;flex:none}.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}.toggle.on .sw{background:var(--dorado)}.toggle.on .sw::after{left:21px}
.toggle span{flex:1;font-size:14px;line-height:1.3}
@media print{header,.foot,.noprint{display:none!important}body{background:#fff;padding:0;font-size:11px}.card{box-shadow:none;border:1px solid #999;break-inside:avoid}}

.login{max-width:420px;margin:30px auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.login h2{margin:0 0 4px;font-size:20px;color:var(--pizarra)}.login p{margin:0 0 12px;font-size:13px;color:var(--muted)}
.clock{font-variant-numeric:tabular-nums;font-size:34px;font-weight:800;letter-spacing:.02em}
.clock.over{color:var(--rojo)}
.rfslot{border:1.5px solid #FFD9C2;background:#FFFAF6;border-radius:10px;padding:10px;margin-top:8px}.rfslot.empty{background:#fff;border-style:dashed}
.who{font-size:12px;color:rgba(255,255,255,.8);white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.userchip{display:inline-block;background:#E5F6F8;color:var(--turquesa);border-radius:99px;padding:2px 8px;font-size:11px;font-weight:700}
</style>
</head>
<body>

async function syncRIT(r){if(!sb||!USER)return;r.updated_at=ahora();if(r.user_id&&r.user_id!==USER.id)return; const row={id:r.id,user_id:USER.id,email:USER.email,supervisor:r.supervisor||CFG.supervisor,area:r.area||CFG.area,fecha:r.fecha,cerrada:!!r.cerrada,cuadrilla_ids:(r.cuadrilla||[]).map(p=>p.uid).filter(Boolean),codigo:r.codigo||CFG.codigo||null,data:r,updated_at:r.updated_at};const {error}=await sb.from("rits").upsert(row);if(error){r._dirty=true;LS.setItem(KEY,JSON.stringify(DB));setEstado(false);}else{delete r._dirty;LS.setItem(KEY,JSON.stringify(DB));setEstado(true);}}

let PEND_CFG=false;
function setEstado(ok){const e=document.getElementById("estado");if(!e)return;const n=DB.filter(r=>r._dirty).length;e.textContent=ok&&!n?"":(navigator.onLine?`⟳ ${n} por subir`:`⚠ sin señal · ${n} por subir`);}
async function reintentar(){if(!sb||!USER||!navigator.onLine)return;for(const r of DB.filter(x=>x._dirty&&(!x.user_id||x.user_id===USER.id)))await syncRIT(r);if(PEND_CFG){PEND_CFG=false;await syncCfg();}setEstado(true);}
window.addEventListener("online",()=>{toast("Conexión recuperada: subiendo pendientes");reintentar();});
window.addEventListener("offline",()=>{toast("Sin señal: se guarda en el celular");setEstado(false);});

async function pullAll(){
  if(!sb||!USER)return;
  const {data:perfil}=await sb.from("perfiles").select("*").eq("id",USER.id).maybeSingle();
  if(perfil){USER.role=perfil.role||"trabajador";USER.nombre=perfil.nombre||USER.nombre;if(perfil.cfg)CFG=Object.assign(CFG,perfil.cfg);CFG.codigo=perfil.codigo||"";CFG.supervisor_id=perfil.supervisor_id||"";CFG.cargo=perfil.cargo||CFG.cargo;}
  else{await sb.from("perfiles").insert({id:USER.id,email:USER.email,nombre:USER.nombre,role:"trabajador",cfg:CFG,cargo:CFG.cargo||null});}
  const lider=CFG.codigo?USER.id:CFG.supervisor_id;
  if(lider){
    const {data:lp}=await sb.from("perfiles").select("id,nombre,cargo,cfg").eq("id",lider).maybeSingle();
    const {data:tr}=await sb.from("perfiles").select("id,nombre,cargo,email").eq("supervisor_id",lider);
    if(lp&&!CFG.codigo){CFG.supervisor_nombre=lp.nombre;const c=lp.cfg||{};CFG.area=c.area||"";CFG.gerencia=c.gerencia||"";CFG.sup=c.sup||"";CFG.turno=c.turno||"A";CFG.supervisor=c.supervisor||lp.nombre;CFG.cuadrilla=(c.cuadrilla||[]).map(p=>({...p}));}
    const todos=[...(lp?[{id:lp.id,nombre:lp.nombre,cargo:lp.cargo}]:[]),...(tr||[])];
    todos.forEach(t=>{let p=CFG.cuadrilla.find(x=>x.uid===t.id);if(!p){p=CFG.cuadrilla.find(x=>!x.uid&&x.nombre.toLowerCase()===(t.nombre||"").toLowerCase());if(p)p.uid=t.id;else CFG.cuadrilla.push({id:uid(),uid:t.id,nombre:t.nombre||t.email,cargo:t.cargo||""});}else{p.nombre=t.nombre||p.nombre;p.cargo=t.cargo||p.cargo;}});
    if(CFG.codigo)syncCfg();
  }
  await reintentar();
  const {data:rows,error}=await sb.from("rits").select("id,user_id,email,data,updated_at").order("updated_at",{ascending:false}).limit(2000);
  if(error){toast("Sin conexión: trabajando con datos locales");return;}
  const map=new Map(DB.filter(r=>!r.user_id||r.user_id===USER.id).map(r=>[r.id,r]));
  rows.forEach(x=>{const r=x.data;r.user_id=x.user_id;r.email=x.email;const loc=map.get(r.id);if(!loc||(x.updated_at>(loc.updated_at||"")))map.set(r.id,r);});
  DB=[...map.values()].sort((a,b)=>(a.inicioTs||"").localeCompare(b.inicioTs||""));
  DB.filter(r=>(!r.user_id||r.user_id===USER.id)&&!rows.find(x=>x.id===r.id)).forEach(r=>syncRIT(r));
  save(false);
}

async function refrescarRIT(id){
  if(!sb||!USER)return false;const {data}=await sb.from("rits").select("data,updated_at,user_id,email").eq("id",id).maybeSingle();if(!data)return false;
  const r=data.data;r.user_id=data.user_id;r.email=data.email;const i=DB.findIndex(x=>x.id===id);
  if(i<0){DB.push(r);}else{if((DB[i].updated_at||"")>=data.updated_at)return false;DB[i]=r;}
  if(R&&R.id===id)R=DB.find(x=>x.id===id);
  if(isLider()&&r.user_id===USER.id){let n=0;(r.cuadrilla||[]).forEach(p=>{if(!CFG.cuadrilla.some(q=>q.id===p.id||q.nombre.toLowerCase()===p.nombre.toLowerCase())){CFG.cuadrilla.push({...p});n++;}});if(n){LS.setItem(KEYC,JSON.stringify(CFG));syncCfg();}}
  save(false);return true;
}

async function rpcTrab(fn,args){
  if(sb){if(!navigator.onLine){toast("Sin señal: se enviará cuando vuelva la conexión");COLA.push({fn,args});LS.setItem("rit9.cola",JSON.stringify(COLA));return false;}const {data,error}=await sb.rpc(fn,args);if(error){toast("No se pudo enviar: "+error.message);return false;}return true;}
  return true; // modo local: se aplica directo abajo
}

async function rpcAsis(fn,args){
  if(sb){const {data,error}=await sb.rpc(fn,args);if(error){ASIS_MSG=error.message;return null;}return data;}
  /* modo local / demo: emular sobre DB */
  const lider=(DB.find(r=>r.codigo===args.p_codigo)||{});const r=DB.filter(x=>x.codigo===args.p_codigo&&x.fecha===today()).sort((a,b)=>(b.inicioTs||"").localeCompare(a.inicioTs||""))[0];
  if(fn==="rit_ver")return r?{ok:true,rit:r}:{ok:false,msg:"sin_rit"};
  if(!r)return {ok:false,msg:"sin_rit"};
  if(fn==="rit_asistir"){let p=r.cuadrilla.find(x=>x.nombre.toLowerCase()===args.p_nombre.toLowerCase());if(!p){p={id:uid(),nombre:args.p_nombre,cargo:args.p_cargo||""};r.cuadrilla.push(p);}else if(args.p_cargo)p.cargo=args.p_cargo;if(!r.asistentes.includes(p.id))r.asistentes.push(p.id);r.condicion[p.id]={ok:args.p_ok,motivo:args.p_motivo||"",self:true,ts:ahora()};r.updated_at=ahora();save(false);return {ok:true,rit:r};}
  if(fn==="rit_confirmar_anon"){const a=r.acts.find(x=>x.id===args.p_act);const k=a&&a.rfs[args.p_j].ctl.find(x=>x.c===args.p_c&&x.enc.toLowerCase()===args.p_nombre.toLowerCase());if(!k)return {ok:false,msg:"no_es_tuyo"};k.confirmado=args.p_valor;k.confirmadoTs=args.p_valor?ahora():null;r.updated_at=ahora();save(false);return {ok:true,rit:r};}

function render(){

  const tm=document.getElementById("timer");tm.classList.toggle("hid",!(enRit&&!R.cerrada));
  if(enRit&&!R.cerrada){const sg=segundos(R);tm.textContent=`⏱ ${mmss(sg)}`;tm.classList.toggle("over",sg>MAX_MIN*60);}
  document.getElementById("who").textContent=USER?USER.nombre.split(" ")[0]+(isAdmin()?" · admin":isLider()?" · líder":""):"";
  document.getElementById("repoBtn").classList.toggle("hid",!USER||view==="login"||view==="asis"||view==="repo"||view==="rep");
  const main=document.getElementById("main");
  if(view==="login"){pLogin();return;}
  if(view==="asis"){main.innerHTML=pAsis();return;}
  if(view==="home"){const r0=ritDeHoyTrab();main.innerHTML=(isTrab()||(isLider()&&r0&&r0.user_id!==USER.id&&!r0.cerrada))?homeTrab():home();return;}
  if(view==="resumen"){main.innerHTML=pResumen();return;}
  if(view==="repo"){main.innerHTML=repositorio();return;}
  if(view==="rep"){main.innerHTML=reporte();return;}
  const S=STEPS(),k=S[step];
  document.getElementById("progT").textContent=`Paso ${step+1} de ${S.length}`;document.getElementById("progB").style.width=((step+1)/S.length*100)+"%";
  document.getElementById("bPrev").textContent=step===0?"Inicio":"Atrás";
  const bn=document.getElementById("bNext");
  if(k==="cierre"){bn.textContent=R.cerrada?"Volver al inicio":"✓ Cerrar RIT";bn.className=R.cerrada?"btn s":"btn t";}else{bn.textContent="Siguiente";bn.className="btn p";}
  main.innerHTML=`<div class="guia">${GUIA[k]}</div>`+({dirige:pDirige,asist:pAsist,acts:pActs,entorno:pEntorno,ultimo:pUltimo,cierre:pCierre})[k]();

}

const STEPS=()=>R&&R.ultimo?["dirige","asist","acts","entorno","ultimo","cierre"]:["dirige","asist","acts","entorno","cierre"];
const GUIA={dirige:"La reunión se hace <b>cada día</b> al inicio de la jornada, dura máximo <b>30 min</b> y la dirige un trabajador <b>distinto cada día</b>.",
 asist:"<b>Paso 1 de la guía:</b> pregunta a cada asistente si está en condiciones de realizar su trabajo.",
 acts:"<b>Pasos 3 a 5:</b> escribe las actividades del día, marca las críticas, revisa instructivos / materiales / herramientas / EPP, y por cada una define hasta 3 riesgos de fatalidad con sus controles.",
 entorno:"<b>Paso 6:</b> ¿qué condiciones del entorno podrían afectar la ejecución? Clima, trabajos en simultáneo, mantenciones correctivas.",
 ultimo:"<b>Pasos 8 y 9 (último día del turno):</b> pide aportes para la gestión de riesgos y designen a un trabajador para ser reconocido.",
 cierre:"<b>Paso 10:</b> para cerrar, repasen los riesgos de fatalidad y sus controles. Luego firman quien dirigió y el supervisor."};
function go(d){
  const S=STEPS();
  if(step===0&&d<0){setView("home");return;}
  if(S[step]==="cierre"&&d>0){if(R.cerrada)setView("home");else cerrar();return;}
  if(d>0&&S[step]==="dirige"&&!R.dirige){toast("Elige quién dirige hoy");return;}
  if(d>0&&S[step]==="asist"&&!R.asistentes.length){toast("Marca al menos un asistente");return;}
  step=Math.max(0,Math.min(S.length-1,step+d));render();window.scrollTo(0,0);
}

function cumplir(ritId,prop){const r=DB.find(x=>x.id===ritId);const a=r.aportes.find(x=>x.prop===prop);if(a)a.estado="cumplido";syncRIT(r);save(false);render();toast("Aporte cumplido");}
const tvs=r=>{const t=[];r.acts.forEach(a=>Object.entries(a.tv||{}).forEach(([k,v])=>t.push({act:a.nombre,item:k,...v})));return t;};
function alertas(r){const al=[];r.acts.forEach(a=>{PREP.forEach(([p])=>{if(a.prep[p]===false)al.push(`${a.nombre||"Actividad"}: ${p} NO · TV ${a.tv[p]?.num||"s/n"}`);});a.rfs.forEach(s=>s.ctl.forEach(c=>{if(!c.enc)al.push(`${s.rf}-${c.c} sin encargado`);}));});
  Object.entries(r.condicion).forEach(([id,c])=>{if(c.ok===false){const p=(r.cuadrilla||[]).find(x=>x.id===id);al.push(`${p?p.nombre:"Trabajador"} no en condiciones`);}});
  if(r.finTs&&segundos(r)>MAX_MIN*60)al.push(`Reunión de ${minutos(r)} min (máx. ${MAX_MIN})`);return al;}

/* ========= VISTA TRABAJADOR ========= */
const r0=()=>ritDeHoyTrab();
function homeTrab(){

     !r?`<p>Cuadrilla de ${esc(CFG.supervisor_nombre||CFG.supervisor||"")} · ${esc(CFG.area||"")}<br>Nadie ha iniciado la RIT de hoy todavía.</p><button class="btn p big w" onclick="iniciarHoy()">▶ Iniciar RIT de hoy (yo la registro)</button><button class="btn s w" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)" onclick="pullAll().then(render)">↻ Actualizar</button>`:
     r.user_id===USER.id&&!r.cerrada?`<p>Estás registrando la RIT de hoy · dirige ${esc(r.dirige)||"—"}</p><button class="btn p big w" onclick="R=r0();step=0;setView('rit')">▶ Continuar RIT de hoy</button>`:
     !pres?`<p>RIT en curso · dirige ${esc(r.dirige)||"—"} · registra ${esc(r.registra||r.supervisor)}</p><div class="q" style="color:#fff;font-size:18px">¿Estás en condiciones de realizar tu trabajo?</div><div class="row"><button class="btn big" style="background:var(--verde);color:#fff" onclick="marcarMiAsistencia(true)">✓ Sí, presente</button><button class="btn big r" onclick="modalNoCond()">No</button></div>`:
     `<p>${c&&c.ok===false?"⚠️ Registrado: no en condiciones · "+esc(c.motivo):"✓ Presente y en condiciones"}${r.cerrada?" · RIT cerrada":""}</p>${r.cerrada?"":`<button class="btn s sm" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)" onclick="modalNoCond()">Cambiar a "no en condiciones"</button>`}`}
   <div style="text-align:right;margin-top:8px"><button class="btn d" style="color:rgba(255,255,255,.6)" onclick="modalPerfilTrab()">Mi perfil</button><button class="btn d" style="color:rgba(255,255,255,.6)" onclick="salir()">Cerrar sesión</button></div></div>
  ${r&&pres?`
  ${misCtl.length?`<div class="card"><h2>Mis controles a confirmar en terreno <span class="tag ${misCtl.every(x=>x.k.confirmado)?"ok":"no"}">${misCtl.filter(x=>x.k.confirmado).length}/${misCtl.length}</span></h2>
   ${misCtl.map(({a,s,j,k})=>`<button class="btn ${k.confirmado?"t":"s"} w" style="justify-content:flex-start;text-align:left;font-weight:500;line-height:1.3" ${r.cerrada&&!k.confirmado?"disabled":""} onclick="confirmarControl('${a.id}',${j},'${k.c}')"><span style="font-size:20px">${k.confirmado?"✓✓":"☐"}</span><span><b>${s.rf}-${k.c}</b> ${esc(RF[s.rf].c.find(x=>x[0]===k.c)[1])}<br><small style="opacity:.8">${esc(a.nombre)}</small></span></button>`).join("")}
   <div class="info">Toca cada control cuando lo hayas verificado en terreno. Tu supervisor lo ve al instante.</div></div>`:""}
  <div class="card"><h2>RIT de hoy · dirige ${esc(r.dirige)||"—"}</h2>
   ${r.acts.filter(a=>a.nombre).map((a,i)=>`<div class="rfslot" style="background:#fff"><b>${i+1}. ${esc(a.nombre)}</b>${a.critica?' <span class="tag no">crítica</span>':""}
    ${PREP.filter(([p])=>a.prep[p]===false).map(([p])=>`<div class="info warn">🟩 ${p}: NO · TV ${esc(a.tv[p]?.num||"")}</div>`).join("")}
    ${a.rfs.filter(x=>x.rf).map(x=>`<div style="font-size:13px;margin-top:6px"><span class="tag rf">${x.rf}</span> <b>${RF[x.rf].n}</b>${x.cons?` · ${esc(x.cons)}`:""}<br>${x.ctl.map(k=>`<span class="tag ${k.c.startsWith("CCP")?"ccp":"ccm"}">${k.c}</span> ${esc(RF[x.rf].c.find(z=>z[0]===k.c)[1])} → 👤 ${esc(k.enc)}${k.confirmado?" <b style='color:var(--verde)'>✓✓</b>":""}`).join("<br>")}</div>`).join("")}</div>`).join("")||`<div class="empty">El supervisor aún no registra las actividades.</div>`}
   ${Object.entries(r.entorno||{}).filter(([k,v])=>v).map(([k,v])=>`<div class="info">${ENTORNO.find(e=>e[0]===k)[1]}: ${esc(v)}</div>`).join("")}
   <div style="text-align:center;margin-top:8px"><button class="btn s sm" onclick="refrescarRIT('${r.id}').then(()=>render())">↻ Actualizar</button></div></div>`:""}
  <div class="card"><h2>Mi historial</h2>${mias.filter(x=>!(r&&x.id===r.id)).slice(0,30).map(x=>{const q=(x.cuadrilla||[]).find(z=>z.uid===USER.id);const pr=q&&x.asistentes.includes(q.id);const cc=q?x.condicion[q.id]:null;const n=x.acts.reduce((m,a)=>m+a.rfs.reduce((o,s)=>o+s.ctl.filter(k=>k.enc===USER.nombre).length,0),0);const rec=x.recon.filter(z=>z.quien===USER.nombre);return `<div class="ritrow"><div class="nm"><b>${fmt(x.fecha)}</b><small>${pr?(cc&&cc.ok===false?"⚠️ no en condiciones":"✓ presente"):"— ausente"} · dirigió ${esc(x.dirige)||"—"}${n?` · ${n} control(es) a mi cargo`:""}${rec.length?" · 🏅 reconocido":""}</small></div></div>`;}).join("")||`<div class="empty">Aquí verás tus asistencias y controles de cada día.</div>`}</div>`;
}
function modalNoCond(){openModal(`<h3>⚠️ No estoy en condiciones</h3><label>¿Qué te pasa? (lo verá tu supervisor)</label><textarea id="nM" placeholder="Ej: malestar, fatiga, dolor…"></textarea><div class="row" style="margin-top:12px"><button class="btn s" onclick="closeModal()">Cancelar</button><button class="btn r" onclick="const m=nM.value.trim();if(!m){toast('Indica el motivo');return;}closeModal();marcarMiAsistencia(false,m)">Enviar</button></div>`);}
function modalUnirse(){openModal(`<h3>Unirme a mi cuadrilla</h3><p style="font-size:13px;color:var(--muted)">Pídele a tu supervisor el código de 6 letras que aparece en su app.</p><label>Código de cuadrilla</label><input id="uC" style="text-transform:uppercase;letter-spacing:.15em;font-size:22px;text-align:center" maxlength="6" placeholder="ABC123"><button class="btn p w" onclick="unirse()">Unirme</button><button class="btn s sm w" onclick="closeModal()">Cancelar</button>`);setTimeout(()=>uC.focus(),50);}
async function unirse(){const code=uC.value.trim().toUpperCase();if(code.length<4){toast("Código incompleto");return;}
  if(sb){const {data,error}=await sb.rpc("rit_unirse_cuadrilla",{p_codigo:code});if(error||!data){toast("Código no encontrado");return;}CFG.supervisor_id=data.supervisor_id;CFG.supervisor_nombre=data.nombre;CFG.area=data.area||"";CFG.codigo="";CFG.cuadrilla=[];await sb.from("perfiles").update({codigo:null,supervisor_id:CFG.supervisor_id,cfg:CFG,updated_at:ahora()}).eq("id",USER.id);await pullAll();}
  else{CFG.supervisor_nombre="(modo local)";}
  save(false);closeModal();render();toast("Te uniste a la cuadrilla de "+(CFG.supervisor_nombre||""));}
function modalPerfilTrab(){openModal(`<h3>Mi perfil</h3><label>Nombre</label><input id="pN" value="${esc(USER.nombre)}"><label>Cargo / empresa</label><input id="pC" value="${esc(CFG.cargo||"")}"><div class="info">Cuadrilla: ${esc(CFG.supervisor_nombre||"—")} · ${esc(CFG.area||"")}</div><button class="btn s sm w" onclick="closeModal();modalUnirse()">Cambiar de cuadrilla</button><button class="btn s sm w" onclick="crearCuadrilla()">Crear mi propia cuadrilla</button><button class="btn p w" onclick="USER.nombre=pN.value.trim()||USER.nombre;CFG.cargo=pC.value.trim();LS.setItem(KEYU,JSON.stringify(USER));save(false);syncCfg();closeModal();render()">Guardar</button>`);}

/* ========= RESUMEN (RIT cerrada) ========= */
function pResumen(){
  const nombres=(R.cuadrilla||[]).filter(p=>R.asistentes.includes(p.id)).map(p=>p.nombre),al=alertas(R),tv=tvs(R);
  return `<div class="card sum" style="border-top:5px solid var(--verde)"><h2>✓ RIT cerrada</h2>
   <dl><dt>Fecha</dt><dd><b>${fmt(R.fecha)}</b> · Turno ${esc(R.turno||"")}${R.ultimo?" · último día":""}</dd><dt>Área</dt><dd>${esc(R.area)}</dd><dt>Supervisor</dt><dd>${esc(R.supervisor)}</dd><dt>Dirigió</dt><dd>${esc(R.dirige)}</dd><dt>Duración</dt><dd>${mmss(segundos(R))} (${R.inicioTs?R.inicioTs.slice(11,16):""} → ${R.finTs?new Date(R.finTs).toTimeString().slice(0,5):""})</dd><dt>Asistentes</dt><dd>${nombres.length}</dd><dt>Actividades</dt><dd>${R.acts.filter(a=>a.nombre).length} (${R.acts.filter(a=>a.critica).length} críticas)</dd><dt>RF</dt><dd>${rfsDe(R).map(k=>`<span class="tag rf">${k}</span>`).join(" ")||"—"}</dd><dt>Tarjetas Verdes</dt><dd>${tv.length?tv.map(t=>`<span class="tag tv">🟩 ${esc(t.num)}</span>`).join(" "):"—"}</dd><dt>Alertas</dt><dd>${al.length?`<span class="tag no">${al.length}</span>`:`<span class="tag ok">0</span>`}</dd></dl></div>
   <button class="btn p big w" onclick="setView('home')">Volver al inicio</button>
   <button class="btn s sm w" onclick="detalles()">Ver detalles</button>
   <div style="text-align:center;margin-top:14px"><button class="btn d" onclick="eliminarRIT('${R.id}')">🗑 Eliminar esta RIT</button></div>`;
}

  openModal(`<h3>👥 Cuadrilla y datos del área</h3>${first?`<div class="info">Se guarda una sola vez; después solo tocas "Iniciar RIT de hoy".</div>`:""}
   <div class="row"><div><label>Gerencia</label><input id="cG" value="${esc(CFG.gerencia)}" placeholder="GOP"></div><div><label>Superintendencia / EE.CC.</label><input id="cS" value="${esc(CFG.sup)}" placeholder="SINFRA"></div></div>
   <label>Área / frente de trabajo</label><input id="cA" value="${esc(CFG.area)}" placeholder="Ej: Techumbres Planta LR">
   <div class="row"><div><label>Supervisor responsable (firma)</label><input id="cP" value="${esc(CFG.supervisor||(USER?USER.nombre:""))}"></div><div><label>Turno</label><select id="cT">${TURNOS.map(t=>`<option ${t===CFG.turno?"selected":""}>${t}</option>`).join("")}</select></div></div>
   ${CFG.codigo?`<div class="info"><b>Código de cuadrilla: ${CFG.codigo}</b> · quien lo ingrese en su app queda en tu cuadrilla y marca su propia asistencia.</div>`:""}
   <label>Integrantes (los que ingresan tu código aparecen solos; agrega a mano a quien no use la app)</label><div id="cuadL">${cuadHTML()}</div>
   <div class="row" style="margin-top:6px"><input id="cN" placeholder="Nombre"><input id="cC" placeholder="Cargo / empresa"></div>
   <button class="btn s sm w" onclick="addCuad()">+ Agregar integrante</button><button class="btn p w" onclick="guardarCfg()">Guardar</button>`);
}
function cuadHTML(){return CFG.cuadrilla.map(p=>`<div class="persona"><div class="av" ${p.uid?'style="background:var(--turquesa)"':""}>${ini(p.nombre)}</div><div class="nm">${esc(p.nombre)}<small>${esc(p.cargo||"")}${p.uid?' · <span style="color:var(--turquesa)">📱 con app</span>':' · sin app (lo marcas tú)'}</small></div>${p.uid?"":`<button class="btn d" onclick="delCuad('${p.id}')">✕</button>`}</div>`).join("")||`<div class="empty">Sin integrantes aún. Comparte tu código para que se unan, o agrégalos a mano.</div>`;}
function addCuad(){const n=document.getElementById("cN").value.trim();if(!n)return;CFG.cuadrilla.push({id:uid(),nombre:n,cargo:document.getElementById("cC").value.trim()});save(false);document.getElementById("cuadL").innerHTML=cuadHTML();cN.value="";cC.value="";cN.focus();}
function delCuad(id){CFG.cuadrilla=CFG.cuadrilla.filter(p=>p.id!==id);save(false);document.getElementById("cuadL").innerHTML=cuadHTML();}
function guardarCfg(){const g=i=>document.getElementById(i).value.trim();Object.assign(CFG,{gerencia:g("cG"),sup:g("cS"),area:g("cA"),supervisor:g("cP"),turno:g("cT")});if(R&&!R.cerrada){R.cuadrilla=CFG.cuadrilla.map(p=>({...p}));Object.assign(R,{supervisor:CFG.supervisor,area:CFG.area,turno:CFG.turno,gerencia:CFG.gerencia,sup:CFG.sup});}save();closeModal();render();}

/* ========= PASOS ========= */
function pDirige(){
  const hechos=DB.filter(x=>x.id!==R.id&&mine(x)).slice(-6).map(x=>x.dirige);
  return `<div class="q">¿Quién dirige la reunión hoy?</div>
   ${cuad().map(p=>`<div class="persona ${R.dirige===p.nombre?"sel":""}" onclick="R.dirige='${esc(p.nombre)}';save();render()"><div class="av">${ini(p.nombre)}</div><div class="nm">${esc(p.nombre)}<small>${esc(p.cargo||"")}${hechos.includes(p.nombre)?" · ya dirigió hace poco":""}</small></div>${R.dirige===p.nombre?"✓":""}</div>`).join("")}
   <div class="toggle ${R.ultimo?"on":""}" onclick="R.ultimo=!R.ultimo;save();render()"><div class="sw"></div><span><b>Hoy es el último día del turno</b><br><small style="color:var(--muted)">Se agrega el paso de aportes y reconocimiento</small></span></div>
   ${R.cerrada?"":`<div style="text-align:center;margin-top:16px"><button class="btn d" onclick="eliminarRIT('${R.id}')">🗑 Eliminar esta RIT</button></div>`}`;
}
function joinURL(){const u=new URL(location.href);u.search="";u.hash="";return `${u.href}?codigo=${R.codigo||CFG.codigo||""}`;}
function pAsist(){
  const noOk=Object.values(R.condicion).filter(c=>c.ok===false).length;
  return `<div class="q">¿Quiénes están y en condiciones?</div><div class="info" style="margin-bottom:10px">Toca el nombre para marcar presente. Luego <b>OK</b> si está en condiciones de trabajar, <b>NO</b> si no.</div>
   ${cuad().map(p=>{const pres=R.asistentes.includes(p.id),c=R.condicion[p.id]||{};return `<div class="persona ${pres?"on":""}"><div class="av" onclick="togAsist('${p.id}')">${pres?"✓":ini(p.nombre)}</div><div class="nm" onclick="togAsist('${p.id}')">${esc(p.nombre)}<small>${esc(p.cargo||"")}${c.ok===false?` · <span style="color:var(--rojo)">${esc(c.motivo)}</span>`:""}${c.self?' · <span style="color:var(--turquesa)">📱 se registró con el código'+(c.ts?" "+new Date(c.ts).toTimeString().slice(0,5):"")+'</span>':""}</small></div>${pres?`<div class="yn"><button class="${c.ok===true?"si":""}" onclick="R.condicion['${p.id}']={ok:true};save();render()">OK</button><button class="${c.ok===false?"no":""}" onclick="modalCond('${p.id}')">NO</button></div>`:""}</div>`;}).join("")}
   <button class="btn s w" onclick="cuad().forEach(p=>{if(!R.asistentes.includes(p.id))R.asistentes.push(p.id);if(!R.condicion[p.id])R.condicion[p.id]={ok:true};});save();render()">Todos presentes y OK</button>
   <div class="card" style="margin-top:12px"><h2>Registro con código <span class="tag ok">${R.asistentes.length} presentes</span>${noOk?` <span class="tag no">${noOk} no en condiciones</span>`:""}</h2><div style="text-align:center;font-size:44px;font-weight:800;letter-spacing:.18em;color:var(--pizarra);padding:6px 0 2px">${esc(R.codigo||CFG.codigo||"—")}</div><div class="info" style="text-align:center">Cada asistente abre la app, escribe este código y su <b>nombre y apellido</b>. Aparece aquí solo, con la hora.</div><div class="row" style="margin-top:8px"><button class="btn s sm" onclick="codigoGrande()">Mostrar en grande</button><button class="btn s sm" onclick="refrescarRIT(R.id).then(()=>render())">↻ Actualizar</button></div></div>`;
}
function togAsist(id){const i=R.asistentes.indexOf(id);if(i<0){R.asistentes.push(id);R.condicion[id]={ok:true};}else{R.asistentes.splice(i,1);delete R.condicion[id];}save();render();}
function modalCond(id){const p=cuad().find(x=>x.id===id),c=R.condicion[id]||{};openModal(`<h3>⚠️ ${esc(p.nombre)} no está en condiciones</h3><label>¿Qué pasa y qué se hace?</label><textarea id="cM" placeholder="Ej: fatiga; se reasigna a apoyo en piso sin carga / se deriva a policlínico">${esc(c.motivo||"")}</textarea><div class="row" style="margin-top:12px"><button class="btn s" onclick="closeModal()">Cancelar</button><button class="btn r" onclick="const m=document.getElementById('cM').value.trim();if(!m){toast('Indica el motivo');return;}R.condicion['${id}']={ok:false,motivo:m};save();closeModal();render()">Registrar</button></div>`);}
function pActs(){return `<div class="q">¿Qué haremos hoy y estamos preparados?</div>${R.acts.map((a,i)=>actHTML(a,i)).join("")}<button class="btn s w" onclick="R.acts.push(nuevaAct());save();render()">+ Otra actividad</button>`;}
const act=id=>R.acts.find(a=>a.id===id);
function actHTML(a,i){
  return `<div class="act ${a.critica?"crit":""}">
   <div class="top"><div class="num">${i+1}</div><input value="${esc(a.nombre)}" placeholder="Actividad ${i+1}: qué y dónde" oninput="act('${a.id}').nombre=this.value;save()">${R.acts.length>MIN_ACTS?`<button class="btn d" onclick="R.acts=R.acts.filter(x=>x.id!=='${a.id}');save();render()">✕</button>`:""}</div>
   <div class="chips" style="margin-top:8px"><div class="chip ${a.critica?"on":""}" onclick="act('${a.id}').critica=!act('${a.id}').critica;save();render()">${a.critica?"🔥 Crítica":"Marcar como crítica"}</div></div>
   <div class="prep">${PREP.map(([p,q])=>`<span style="font-size:14px">${q}${a.prep[p]===false&&a.tv[p]?`<br><span class="tag tv" onclick="modalTV('${a.id}','${p}')">🟩 TV ${esc(a.tv[p].num)}</span>`:""}</span><div class="yn"><button class="${a.prep[p]===true?"si":""}" onclick="act('${a.id}').prep['${p}']=true;delete act('${a.id}').tv['${p}'];save();render()">SÍ</button><button class="${a.prep[p]===false?"no":""}" onclick="modalTV('${a.id}','${p}')">NO</button></div>`).join("")}</div>
   <label style="margin-top:12px">Riesgos de fatalidad de esta actividad (hasta ${RF_POR_ACT})</label>
   ${a.rfs.map((s,j)=>rfSlot(a,j,s)).join("")}</div>`;
}
function rfSlot(a,j,s){
  const d=RF[s.rf],usados=a.rfs.map(x=>x.rf).filter((x,k)=>x&&k!==j);
  return `<div class="rfslot ${s.rf?"":"empty"}"><div style="display:flex;gap:8px;align-items:center"><span class="tag rf">RF ${j+1}</span><select style="flex:1" onchange="const x=act('${a.id}').rfs[${j}];x.rf=this.value;x.ctl=[];save();render()"><option value="">— ${j===0?"Elegir riesgo de fatalidad":"Otro RF (opcional)"} —</option>${Object.keys(RF).filter(k=>!usados.includes(k)).map(k=>`<option value="${k}" ${k===s.rf?"selected":""}>${k} · ${RF[k].n}</option>`).join("")}</select></div>
   ${d?`<div class="info"><b>${d.ev}</b> · energía ${d.en}</div><label>¿Qué podría pasar?</label><input value="${esc(s.cons)}" placeholder="Consecuencia para personas / activos" oninput="act('${a.id}').rfs[${j}].cons=this.value;save()">
   <label>Controles críticos que vamos a verificar <span class="tag ccp">CCP</span> <span class="tag ccm">CCM</span></label>
   <div class="ctl">${d.c.map(([c,t])=>{const m=s.ctl.find(x=>x.c===c);return `<button class="${m?"on":""}" onclick="togCtl('${a.id}',${j},'${c}')"><b>${s.rf}-${c}</b>${t}${m?`<i>👤 Confirma: ${esc(m.enc)}${m.confirmado?' <b style="color:var(--verde)">✓✓ confirmado en terreno</b>':""}</i>`:""}</button>`;}).join("")}</div>`:""}</div>`;
}

let drawing=false,firmaKey="";

const pos=(cv,e)=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};};
document.addEventListener("pointerdown",e=>{const cv=e.target.closest("#sig");if(!cv)return;drawing=true;cv._d=true;const x=cv.getContext("2d"),p=pos(cv,e);x.beginPath();x.moveTo(p.x,p.y);});
document.addEventListener("pointermove",e=>{if(!drawing)return;const cv=document.getElementById("sig");if(!cv)return;const x=cv.getContext("2d");x.lineWidth=3;x.lineCap="round";x.strokeStyle="#1E2428";const p=pos(cv,e);x.lineTo(p.x,p.y);x.stroke();});

function tick(){const v=document.getElementById("vid"),c=document.getElementById("cvs");if(!v||!scanStream)return;if(v.readyState===v.HAVE_ENOUGH_DATA){c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext("2d");x.drawImage(v,0,0);const code=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(code){try{const o=JSON.parse(code.data);if(o.rit===R.id&&registrar(o.n,o.c)){if(navigator.vibrate)navigator.vibrate(80);document.getElementById("scanMsg").innerHTML=`<b style="color:var(--verde)">✓ ${esc(o.n)}</b> registrado.`;setTimeout(()=>{if(scanStream)scanRAF=requestAnimationFrame(tick);},1500);return;}}catch(e){}}}scanRAF=requestAnimationFrame(tick);}

   <div class="kpi v"><b>${tv.length}</b><span>Tarjetas Verdes</span></div><div class="kpi r"><b>${al.length}</b><span>Alertas</span></div><div class="kpi r"><b>${noc}</b><span>No en condiciones</span></div>
   <div class="kpi n"><b>${base.reduce((n,r)=>n+r.acts.filter(a=>a.critica).length,0)}</b><span>Actividades críticas</span></div><div class="kpi t"><b>${ctlTot?Math.round((ctlTot-ctlSin)/ctlTot*100):0}%</b><span>Controles con encargado</span></div><div class="kpi"><b>${base.reduce((n,r)=>n+r.aportes.filter(a=>a.prop&&a.estado!=="cumplido").length,0)}</b><span>Aportes pendientes</span></div>
   ${isAdmin()?`<div class="kpi t"><b>${Object.keys(porSup).length}</b><span>Supervisores</span></div><div class="kpi"><b>${new Set(base.map(r=>r.area)).size}</b><span>Áreas</span></div><div class="kpi t"><b>${new Set(base.map(r=>r.dirige).filter(Boolean)).size}</b><span>Han dirigido</span></div>`:""}</div>
   ${isAdmin()?`<div class="card" style="margin-top:12px"><h2>RIT por supervisor</h2>${Object.entries(porSup).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>bar(esc(k),v.n,Math.max(...Object.values(porSup).map(x=>x.n)),"var(--turquesa)")+`<div style="font-size:11px;color:var(--muted);margin:-4px 0 6px 118px">prom. ${v.n?Math.round(v.min/v.n):0}' · 🟩 ${v.tv} TV · ${v.al} alertas</div>`).join("")||`<div class="empty">Sin datos.</div>`}</div>`:""}
   <div class="card" ${isAdmin()?"":'style="margin-top:12px"'}><h2>RF más frecuentes</h2>${top.map(([k,v])=>bar(`<b>${k}</b> ${RF[k].n}`,v,top[0][1],"var(--naranjo)")).join("")||`<div class="empty">Sin datos.</div>`}</div>
   <div class="card"><h2>Tarjetas Verdes</h2>${base.flatMap(r=>tvs(r).map(t=>`<div class="info">🟩 <b>TV ${esc(t.num)}</b> · ${fmtS(r.fecha)} · ${esc(r.supervisor||"")} · ${esc(t.act)} · ${t.item}<br>${esc(t.desc)}</div>`)).reverse().join("")||`<div class="empty">Ninguna.</div>`}</div>
   <div class="card"><h2>Alertas</h2>${al.slice().reverse().map(x=>`<div class="ritrow"><div class="nm">${esc(x.a)}<small>${fmtS(x.r.fecha)} · ${esc(x.r.supervisor||x.r.email||"")} · ${esc(x.r.area||"")}</small></div><button class="btn s sm" onclick="abrir('${x.r.id}')">Ver</button></div>`).join("")||`<div class="empty">Sin alertas 👏</div>`}</div>
   <div class="card noprint"><button class="btn s sm w" style="margin:0" onclick="exportarCSV(${isAdmin()?"filtrar(DB)":"DB.filter(mine)"})">Exportar CSV</button><button class="btn s sm w" onclick="window.print()">Imprimir</button></div>`;
}

/* ========= ARRANQUE ========= */
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal"){if(scanStream)stopScan();else closeModal();}};
setInterval(()=>{if(!R||R.cerrada)return;const sg=segundos(R);if(view==="rit"){const t=document.getElementById("timer");t.textContent=`⏱ ${mmss(sg)}`;t.classList.toggle("over",sg>MAX_MIN*60);}const hc=document.getElementById("homeClock");if(hc){hc.textContent=`⏱ ${mmss(sg)}`;hc.classList.toggle("over",sg>MAX_MIN*60);}},1000);

async function arranque(){
  if(Q.get("codigo")){ASIS=Object.assign(ASIS||{},{codigo:Q.get("codigo").toUpperCase()});LS.setItem("rit.asis",JSON.stringify(ASIS));view="asis";render();cargarAsis();return;}
  if(ASIS&&ASIS.codigo&&!(sb&&(await sb.auth.getSession()).data.session)&&!LS.getItem(KEYU)){view="asis";render();cargarAsis();return;}
  if(sb){const {data}=await sb.auth.getSession();if(data.session){await sesionDesde(data.session.user);return;}view="login";render();return;}
  const u=JSON.parse(LS.getItem(KEYU)||"null");if(u){USER=u;entrar();}else{view="login";render();}
}
arranque();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}}
</script>
